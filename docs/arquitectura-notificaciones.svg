<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ai" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#111827">Arquitectura Hexagonal – E-commerce 5M con subsistema de notificaciones</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">Puerto de salida EmailServicePort + adaptador NodemailerAdapter (elementos nuevos en naranja)</text>

  <!-- Leyenda -->
  <rect x="1010" y="30" width="16" height="16" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1034" y="43" font-size="13" fill="#374151">Nuevo en esta actividad</text>
  <rect x="1200" y="30" width="16" height="16" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="1224" y="43" font-size="13" fill="#374151">Existente</text>
  <line x1="1010" y1="62" x2="1050" y2="62" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ai)"/>
  <text x="1060" y="66" font-size="13" fill="#374151">implementa (extends)</text>

  <!-- ============ LADO IZQUIERDO: adaptadores de entrada ============ -->
  <text x="40" y="128" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">ADAPTADORES DE ENTRADA</text>

  <rect x="40" y="145" width="250" height="150" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="58" y="172" font-size="15" font-weight="700" fill="#1e1b4b">Frontend React + Vite</text>
  <text x="58" y="194" font-size="13" fill="#374151">ClientModule.jsx (carrito)</text>
  <rect x="52" y="208" width="226" height="74" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="64" y="230" font-size="13" font-weight="700" fill="#9a3412">CheckoutConfirmation.jsx</text>
  <text x="64" y="249" font-size="12" fill="#7c2d12">Pago: transferencia/depósito</text>
  <text x="64" y="266" font-size="12" fill="#7c2d12">Folio + "Pendiente de pago"</text>

  <rect x="40" y="345" width="250" height="150" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="58" y="372" font-size="15" font-weight="700" fill="#1e1b4b">Express (interfaces)</text>
  <text x="58" y="396" font-size="13" fill="#374151">POST /pedidos</text>
  <text x="58" y="416" font-size="13" fill="#374151">authMiddleware (JWT, rol cliente)</text>
  <text x="58" y="436" font-size="13" fill="#374151">OrderController.create()</text>
  <text x="58" y="466" font-size="12" fill="#6b7280">server.js: composición e</text>
  <text x="58" y="482" font-size="12" fill="#6b7280">inyección de dependencias</text>

  <line x1="165" y1="295" x2="165" y2="343" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="175" y="324" font-size="12" fill="#374151">HTTP / JSON</text>

  <!-- ============ HEXÁGONO: núcleo ============ -->
  <polygon points="420,450 515,165 885,165 980,450 885,735 515,735" fill="#f8fafc" stroke="#111827" stroke-width="2.5"/>
  <text x="700" y="198" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle" letter-spacing="1">NÚCLEO (sin dependencias externas)</text>

  <!-- Aplicación -->
  <rect x="540" y="215" width="320" height="140" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="556" y="240" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="1">APLICACIÓN</text>
  <text x="556" y="262" font-size="15" font-weight="700" fill="#1e1b4b">OrderService</text>
  <text x="556" y="284" font-size="13" fill="#374151">createOrder(): valida stock, calcula total,</text>
  <text x="556" y="302" font-size="13" fill="#374151">guarda pedido PENDIENTE</text>
  <rect x="552" y="314" width="296" height="32" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="564" y="335" font-size="13" font-weight="700" fill="#9a3412">notificarPedido() → usa el puerto</text>

  <!-- Dominio -->
  <rect x="510" y="380" width="380" height="330" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="526" y="405" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="1">DOMINIO</text>
  <rect x="526" y="418" width="130" height="44" rx="6" fill="#eef2ff" stroke="#4338ca"/>
  <text x="591" y="445" font-size="13" font-weight="600" fill="#1e1b4b" text-anchor="middle">Entidad Order</text>
  <rect x="670" y="418" width="204" height="44" rx="6" fill="#eef2ff" stroke="#4338ca"/>
  <text x="772" y="438" font-size="12" fill="#1e1b4b" text-anchor="middle">Entidades User, Product</text>
  <text x="772" y="454" font-size="11" fill="#6b7280" text-anchor="middle">(existentes)</text>

  <text x="526" y="490" font-size="12" font-weight="700" fill="#6b7280">PUERTOS DE SALIDA</text>
  <rect x="526" y="500" width="348" height="40" rx="6" fill="#eef2ff" stroke="#4338ca"/>
  <text x="700" y="525" font-size="12.5" fill="#1e1b4b" text-anchor="middle">OrderRepository · UserRepository · ProductRepository</text>

  <rect x="526" y="556" width="348" height="138" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="542" y="580" font-size="11" font-weight="700" fill="#c2410c" letter-spacing="1">«interface» NUEVO</text>
  <text x="542" y="603" font-size="17" font-weight="700" fill="#9a3412">EmailServicePort</text>
  <text x="542" y="628" font-size="13" fill="#7c2d12">+ enviarComprobantePedido({pedido, cliente})</text>
  <text x="542" y="649" font-size="13" fill="#7c2d12">+ notificarNuevoPedidoAdmin({pedido, cliente})</text>
  <text x="542" y="676" font-size="12" fill="#9a3412">→ { enviado, messageId, previewUrl }</text>

  <!-- uso del puerto desde OrderService -->
  <path d="M700,346 L700,366 L470,366 L470,620 L524,620" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#an)"/>
  <text x="478" y="470" font-size="12" font-weight="700" fill="#c2410c">usa</text>

  <!-- entrada → núcleo -->
  <line x1="290" y1="420" x2="538" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="335" font-size="12" fill="#374151">createOrder()</text>

  <!-- ============ LADO DERECHO: adaptadores de salida ============ -->
  <text x="1040" y="128" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">ADAPTADORES DE SALIDA</text>

  <rect x="1040" y="145" width="320" height="110" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="1058" y="172" font-size="15" font-weight="700" fill="#1e1b4b">Repositorios PostgreSQL</text>
  <text x="1058" y="194" font-size="13" fill="#374151">OrderRepositoryPostgres, ...</text>
  <text x="1058" y="214" font-size="13" fill="#374151">INSERT pedidos (estado = 'PENDIENTE')</text>
  <text x="1058" y="234" font-size="13" fill="#374151">+ detalle_pedido</text>

  <rect x="1150" y="285" width="210" height="56" rx="28" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="1255" y="318" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">PostgreSQL · ecommerce_db</text>
  <line x1="1255" y1="255" x2="1255" y2="283" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <path d="M1038,200 L1005,200 L1005,520 L878,520" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ai)"/>

  <!-- NodemailerAdapter -->
  <rect x="1040" y="420" width="320" height="200" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="1058" y="444" font-size="11" font-weight="700" fill="#c2410c" letter-spacing="1">NUEVO · infrastructure/email</text>
  <text x="1058" y="468" font-size="17" font-weight="700" fill="#9a3412">NodemailerAdapter</text>
  <text x="1058" y="490" font-size="13" fill="#7c2d12">extends EmailServicePort</text>
  <text x="1058" y="510" font-size="13" fill="#7c2d12">configDesdeEntorno() · EMAIL_PROVIDER</text>
  <rect x="1054" y="522" width="292" height="84" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="1066" y="542" font-size="12" font-weight="700" fill="#9a3412">Plantillas</text>
  <text x="1066" y="561" font-size="12" fill="#7c2d12">comprobanteClienteTemplate (desglose +</text>
  <text x="1066" y="577" font-size="12" fill="#7c2d12">  datos bancarios / CLABE / referencia)</text>
  <text x="1066" y="595" font-size="12" fill="#7c2d12">nuevoPedidoAdminTemplate</text>

  <!-- implementa -->
  <line x1="1038" y1="560" x2="878" y2="620" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ai)"/>
  <text x="1030" y="652" font-size="12" font-weight="700" fill="#c2410c" text-anchor="end">implementa</text>

  <!-- nodemailer → proveedores -->
  <rect x="1040" y="660" width="150" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="1115" y="681" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">nodemailer</text>
  <text x="1115" y="699" font-size="11" fill="#6b7280" text-anchor="middle">librería externa</text>
  <line x1="1115" y1="620" x2="1115" y2="658" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1215" y="645" width="145" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="1287" y="668" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">SMTP de pruebas</text>
  <text x="1287" y="687" font-size="12" fill="#374151" text-anchor="middle">Ethereal</text>
  <text x="1287" y="704" font-size="12" fill="#374151" text-anchor="middle">Mailtrap</text>
  <text x="1287" y="719" font-size="11" fill="#6b7280" text-anchor="middle">(o SMTP real)</text>
  <line x1="1190" y1="685" x2="1213" y2="685" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1040" y="760" width="155" height="56" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1117" y="783" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">Cliente</text>
  <text x="1117" y="802" font-size="11" fill="#7c2d12" text-anchor="middle">comprobante + pago</text>
  <rect x="1205" y="760" width="155" height="56" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1282" y="783" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">Administrador</text>
  <text x="1282" y="802" font-size="11" fill="#7c2d12" text-anchor="middle">aviso de nuevo pedido</text>
  <path d="M1260,725 L1260,742 L1117,742 L1117,758" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#an)"/>
  <line x1="1282" y1="725" x2="1282" y2="758" stroke="#c2410c" stroke-width="1.8" marker-end="url(#an)"/>

  <!-- Nota inferior -->
  <rect x="40" y="560" width="350" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="58" y="588" font-size="14" font-weight="700" fill="#111827">Flujo al generar una orden</text>
  <text x="58" y="614" font-size="13" fill="#374151">1. El cliente confirma el carrito.</text>
  <text x="58" y="636" font-size="13" fill="#374151">2. OrderService guarda el pedido como</text>
  <text x="74" y="654" font-size="13" fill="#374151">PENDIENTE (Pendiente de Pago).</text>
  <text x="58" y="676" font-size="13" fill="#374151">3. Llama a EmailServicePort (puerto).</text>
  <text x="58" y="698" font-size="13" fill="#374151">4. NodemailerAdapter arma las plantillas</text>
  <text x="74" y="716" font-size="13" fill="#374151">y envía al cliente y al admin.</text>
  <text x="58" y="738" font-size="13" fill="#374151">5. Si el correo falla, el pedido se</text>
  <text x="74" y="756" font-size="13" fill="#374151">conserva (Promise.allSettled).</text>
  <text x="58" y="784" font-size="12" fill="#6b7280">Dependencias apuntan siempre hacia el núcleo.</text>
</svg>
